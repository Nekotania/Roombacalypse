# ROOMBACALYPSE default configuration.
#
# These values mirror the defaults in roombacalypse/core/config.py, and
# tests/test_config.py fails if the two drift apart. To experiment, copy this
# file and pass it with `--config my.toml` (only the keys you change are
# needed), or override single values with `--set section.key=value`.
#
# Units: SI (m, s, rad, W, J) unless a key ends in _deg.

room = "studio"            # built-in room (config/rooms/<name>.toml) or a path

[simulation]
dt = 0.02                  # physics timestep [s] (50 Hz)
seed = 42                  # root seed for every random stream
control_period = 0.1       # robot software update period [s] (10 Hz); multiple of dt

[robot]                    # nominal "spec sheet", known to the robot's software
radius = 0.17              # body radius [m]
height = 0.092             # body height [m]: drives under anything higher
wheel_base = 0.235         # distance between drive wheels [m]
wheel_radius = 0.036       # drive wheel radius [m]
max_wheel_speed = 0.5      # per-wheel surface speed limit [m/s]
max_wheel_accel = 1.0      # per-wheel acceleration limit [m/s^2]

[drive_errors]             # GROUND TRUTH ONLY: drawn per reset, never visible to the robot
wheel_radius_std = 0.002   # relative std of each wheel's true radius (unequal wheels -> curved "straight" lines)
wheel_base_std = 0.01      # relative std of the true wheel base (turns come out slightly wrong)
slip_std = 0.01            # stationary relative std of the slowly varying wheel slip
slip_time_constant = 0.5   # correlation time of the slip [s]

[lidar]                    # 2D scanner on top of the robot
mount_height = 0.095       # scan plane [m]: sees table legs, not socks or bed undersides
mount_x = -0.02            # turret position along the body x axis [m]
angular_resolution_deg = 1.0
fov_deg = 360.0
max_range = 6.0            # [m]; beyond this: no return (inf)
range_noise_std = 0.008    # sigma = range_noise_std + range_noise_per_metre * range  [m]
range_noise_per_metre = 0.004
dropout_probability = 0.01 # chance that a beam returns nothing
scan_period = 0.2          # 5 Hz; multiple of simulation.dt

[bumper]
arc_deg = 180.0            # front arc covered by the bumper
center_deadband_deg = 15.0 # hits within +-this of straight ahead close both switches

[encoders]
ticks_per_revolution = 508.8

[gyro]                     # yaw-rate gyro (MEMS IMU) datasheet; each power-up draws its own hidden bias/scale
enabled = true
noise_density_deg = 0.01   # angle random walk [deg/sqrt(s)]
bias_std_deg = 0.5         # turn-on bias spread [deg/s]
bias_walk_deg = 0.0005     # bias random walk [deg/s/sqrt(s)]
scale_error_std = 0.003    # relative scale-factor error spread
resolution_deg = 0.0076    # rate quantisation [deg/s] (16 bit over +-250 deg/s)

[odometry]                 # the robot's dead reckoning
use_gyro = true            # heading from the gyro instead of the wheels ("gyrodometry")
gyro_calibration_time = 3.0   # stand still this long on the dock at boot to measure the gyro bias [s]
bias_time_constant = 20.0  # bias estimate keeps updating whenever the wheels stand still [s]

[dock]
width = 0.32               # along the wall [m]
depth = 0.10               # into the room [m]
height = 0.10              # [m]
gap = 0.005                # clearance between docked robot and dock face [m]

[physics]
contact_skin = 0.001       # bodies closer than this count as touching [m]
max_solver_iterations = 8  # penetration-resolution passes per step

[teleop]
linear_speed = 0.3         # arrow-key driving speed [m/s]
boost_linear_speed = 0.5   # with Shift held [m/s]
angular_speed = 2.0        # turn rate [rad/s]

[dwa]                      # Dynamic Window Approach local planner
max_speed = 0.3            # cruise speed cap [m/s]
max_angular_speed = 2.0    # [rad/s]
horizon = 1.5              # how far ahead each candidate arc is simulated [s]
prediction_step = 0.1      # [s]
wheel_samples = 9          # samples per wheel across the dynamic window (odd)
safety_margin = 0.03       # clearance beyond the body radius [m]
clearance_cap = 0.3        # closest approach beyond the margin above which an arc scores no better [m]
heading_weight = 0.2       # facing the goal at the end of the arc (mostly a tie-breaker)
progress_weight = 1.0      # getting closer to the goal over the horizon
clearance_weight = 0.4     # keeping away from obstacles (mean distance along the arc)
intrusion_weight = 1.0     # penalty for dipping into the safety margin
speed_weight = 0.2         # moving at all
obstacle_range = 2.5       # ignore obstacle points farther than this [m]

[wander]                   # milestone-2 autonomous exploration without a map
goal_min_distance = 0.6    # [m]
goal_max_distance = 2.5    # [m]
goal_reached_tolerance = 0.25
goal_timeout = 15.0        # [s]
stall_time = 4.0           # drop a goal if the distance to it stops shrinking for this long [s]
candidate_step_deg = 15.0  # spacing of candidate exploration directions
visit_cell_size = 0.5      # dead-reckoned visit counter cell [m]
backup_distance = 0.12     # reverse this far after a bump [m]
backup_speed = 0.15        # [m/s]
turn_min_deg = 60.0        # escape turn after a bump, drawn from [min, max]
turn_max_deg = 150.0
turn_speed = 1.5           # [rad/s]
bump_memory_seconds = 20.0 # how long a bump location is treated as an obstacle [s]
undock_distance = 0.3      # back straight off the dock this far before exploring [m]

[autonomy]
behaviour = "coverage"     # "coverage" (M4: plan and clean the whole map) or "wander" (M2: map-free)

[planning]                 # costmap, paths and coverage (docs/algorithms/planning.md)
extra_margin = 0.01        # planned clearance beyond body radius + DWA safety margin [m]
cost_scale = 2.0           # extra cost per metre at the lethal boundary (open floor: 1 per metre)
cost_decay = 0.1           # ...falling by a factor e over this distance [m]
unknown_cost = 3.0         # extra cost per metre through never-seen cells
bump_radius = 0.08         # remembered bumps become obstacle discs this big [m]
lane_width = 0.25          # boustrophedon lane spacing [m] (robot is 0.34 m wide: lanes overlap)
lookahead = 0.5            # the local planner steers for a point this far along the path [m]
goal_tolerance = 0.12      # path / lane end reached within this distance [m]
replan_interval = 1.0      # costmap rebuilt this often while driving [s]
frontier_min_size = 0.25   # ignore frontiers shorter than this [m]

[mapping]                  # the robot's log-odds occupancy grid (belief)
resolution = 0.05          # cell size [m]
hit_log_odds = 0.85        # added where a beam ended (p = 0.70 for one hit)
miss_log_odds = -0.4       # added where a beam passed through (p = 0.40 for one miss)
min_log_odds = -2.0        # clamps, so moved furniture can be forgotten / reappear
max_log_odds = 3.5
occupied_log_odds = 0.6    # above: occupied (p > 0.65)
free_log_odds = -0.6       # below: free (p < 0.35)

[slam]                     # graph SLAM (docs/algorithms/slam.md)
node_distance = 0.25       # new keyframe after this much travel [m]...
node_angle_deg = 15.0      # ...or this much rotation
local_map_nodes = 20       # recent keyframes forming the local map new scans are matched against
scan_voxel = 0.04          # scans thinned to one point per voxel before matching [m]
field_resolution = 0.025   # likelihood-field cell for scan matching [m]
field_sigma = 0.05         # likelihood-field width around mapped points [m]
track_min_score = 0.5      # mean likelihood a tracking match needs; else a wider search
track_window = 0.25        # wider (fallback) search window: translation half-width [m]
track_window_deg = 8.0     # ...and rotation half-width
prior_translation_weight = 0.5  # pull of the odometry prediction [1/m^2] (matters in corridors)
prior_rotation_weight = 0.5     # [1/rad^2]
match_point_std = 0.01     # aligned scan points lie this far from mapped surfaces [m]; scales match information
odometry_translation_noise = 0.03  # the robot's own wheel model: std per metre [m/m]
odometry_rotation_noise = 0.03     # heading std per radian turned [rad/rad]
odometry_heading_drift = 0.015     # heading std per metre travelled [rad/m]
gyro_rotation_noise = 0.005        # with the gyro: heading std per radian turned [rad/rad]
gyro_heading_drift = 0.0005        # with the gyro: heading std per second (residual bias) [rad/s]
loop_search_radius = 2.5   # old keyframes this close are loop-closure candidates [m]
loop_min_travel = 5.0      # ...if at least this much travel back along the trajectory [m]
loop_interval = 2.0        # travel between loop-closure attempts [m]
loop_chain_nodes = 10      # keyframes each side of the nearest candidate form the reference map
loop_window = 0.5          # loop-closure search half-width, translation [m]
loop_window_deg = 12.0     # ...and rotation [deg]
loop_min_score = 0.6       # mean likelihood a loop closure needs
loop_max_ambiguity = 0.9   # reject if a clearly different pose scores this fraction of the best
loop_robust_scale = 2.0    # Cauchy kernel on loop closures [standard deviations]
optimizer_iterations = 15  # Levenberg-Marquardt iterations per pose-graph optimisation

[viewer]
width = 1280               # window size [px]
height = 800
panel_width = 340          # status panel on the right [px]
fps = 60
speed_factor = 1.0         # initial simulation speed (x real time)
max_steps_per_frame = 400  # physics steps per frame before dropping time
trail_seconds = 60.0       # length of the ground-truth trail [s]
collision_sound = ""       # when the robot hits something: "" (off), "bonk" (built in), or a WAV/OGG path
sound_volume = 0.8         # [0, 1]
sound_cooldown = 0.6       # minimum time between two collision sounds [s]
