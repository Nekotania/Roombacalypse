# Apartment: six spaces off a hallway. The stress test for mapping and loop closure (Milestone 3).
#
# Coordinates in metres, x to the right, y up, origin at the bottom-left
# corner. Interior walls are fixed `kind = "wall"` boxes 10 cm thick, full
# height; doorways are the gaps between them (80-90 cm, ordinary interior
# doors, always open).
#
#   y=7.5 +---------------+----------+------------------+
#         |   bedroom     | bathroom |     office       |
#   y=4.3 +--  ---------------  --------------  --------+   doors at x 1.6-2.5, 4.7-5.5, 7.4-8.3
#         |                   hallway (1.1 m wide, 10 m long)
#   y=3.0 +------  --------------------------  ---------+   doors at x 2.0-2.9 and 8.0-8.9
#         |        living room       :   kitchen        |   open arch at x 6.25, y 0.8-2.1
#   y=0   +---------------------------------------------+
#        x=0                       x=6.25             x=10
#
# The living room and kitchen open into each other *and* each have a door to
# the hallway, so hallway -> living room -> kitchen -> hallway is a 13 m loop:
# coming back around it, the robot must recognise where it already has been.
# The hallway is a corridor, the classic hard case for scan matching.

[room]
name = "Apartment"
description = "Six spaces off a 10 m hallway, with a loop through living room and kitchen."
outline = [[0.0, 0.0], [10.0, 0.0], [10.0, 7.5], [0.0, 7.5]]

[dock]
position = [0.0, 1.5]      # living room, against the left wall
facing_deg = 0.0

# --- interior walls --------------------------------------------------------------

[[obstacles]]
name = "wall"
kind = "wall"
center = [0.8, 4.25]       # hallway | bedroom, left of the bedroom door
size = [1.6, 0.1]
z = [0.0, 2.5]

[[obstacles]]
name = "wall"
kind = "wall"
center = [3.6, 4.25]       # between the bedroom and bathroom doors
size = [2.2, 0.1]
z = [0.0, 2.5]

[[obstacles]]
name = "wall"
kind = "wall"
center = [6.45, 4.25]      # between the bathroom and office doors
size = [1.9, 0.1]
z = [0.0, 2.5]

[[obstacles]]
