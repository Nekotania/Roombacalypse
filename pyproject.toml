[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roombacalypse"
version = "0.4.0"
description = "An unnecessarily overengineered autonomous robotic vacuum simulator."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ROOMBACALYPSE contributors" }]
keywords = ["robotics", "simulation", "slam", "particle-filter", "path-planning", "pygame"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # pygame-ce is the community-maintained fork of pygame; it is imported as
    # `pygame`. Upstream pygame has no wheels for Python >= 3.14. On Python
    # 3.12/3.13 upstream pygame 2.6 also works (see README, "Installation").
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.8"]

[project.scripts]
roombacalypse = "roombacalypse.app:main"

[tool.setuptools.packages.find]
include = ["roombacalypse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: long acceptance scenarios (minutes); run with `pytest -m slow`",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode symbols (θ, ω, ×) in UI text/docs are intentional

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]  # SciPy ships no type stubs; not worth a scipy-stubs dependency
ignore_missing_imports = true
